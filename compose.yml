services:
  # connect to this database with:
  # postgresql://postgres:postgres@localhost:54320
  postgres:
    image: "postgres:16-alpine"
    # wal_sender_timeout=5s so the SyncWait→Catchup handoff (which is driven
    # by keepalives when the apply worker is idle) completes quickly, same as
    # the integration test containers
    command:
      ["postgres", "-c", "wal_level=logical", "-c", "wal_sender_timeout=5s"]
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      # Run initialization SQL on first container startup
      - ./1.sql:/docker-entrypoint-initdb.d/1.sql:ro
    ports:
      - "54320:5432"
